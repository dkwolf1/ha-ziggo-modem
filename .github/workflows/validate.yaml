name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-and-precommit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  hassfest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest

    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests (HA ${{ matrix.home_assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home_assistant: "2026.4.0"
            requirements: requirements_test_minimum.txt
          - home_assistant: "2026.11.2"
            requirements: requirements_test.txt

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install test dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Verify Home Assistant version
        env:
          EXPECTED_HA_VERSION: ${{ matrix.home_assistant }}
        run: |
          python -c 'import os; from importlib.metadata import version; installed = version("homeassistant"); expected = os.environ["EXPECTED_HA_VERSION"]; assert installed == expected, f"Expected Home Assistant {expected}, got {installed}"'

      - name: Run tests
        run: python -m pytest -q --cov=custom_components.ziggo_modem.config_flow --cov-report=term-missing --cov-fail-under=100

  dependabot-auto-merge:
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    needs: [ruff-and-precommit, hassfest, hacs, tests]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get Dependabot update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
